<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>OPO NICOLE · ORL</title>
<meta name="theme-color" content="#16140f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPO NICOLE">
<style>
:root{
  --bg:#16140f; --panel:#211e18; --panel2:#2a261e; --ink:#f3ece0; --muted:#a89f8d;
  --line:#332e25; --red:#c0392b; --green:#2e8b57; --gold:#b8893b; --blue:#4a7ba8;
  --oto:#b8893b; --lar:#8a7bd8; --rino:#4a9e8f; --far:#c0725b; --gen:#7d8a99;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:16px;line-height:1.5;padding-bottom:78px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#16140f 82%,rgba(22,20,15,0));
  padding:14px 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:19px;letter-spacing:.09em;text-transform:uppercase}
header p{margin:2px 0 0;font-size:12px;color:var(--muted);letter-spacing:.04em}
main{padding:14px 14px 20px;max-width:820px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.card h3{margin:14px 0 6px;font-size:14px;color:var(--muted);letter-spacing:.04em}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.tag.OTO{color:var(--oto);border-color:var(--oto)} .tag.LAR{color:var(--lar);border-color:var(--lar)}
.tag.RINO{color:var(--rino);border-color:var(--rino)} .tag.FAR{color:var(--far);border-color:var(--far)}
.tag.GEN{color:var(--gen);border-color:var(--gen)} .tag.REP{color:var(--gold);border-color:var(--gold)}
button{font-family:inherit;font-size:15px;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer}
button:active{transform:scale(.985)}
.btn-main{background:var(--gold);color:#1a1710;border-color:var(--gold);font-weight:700;letter-spacing:.03em}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn-row button{flex:1 1 auto;min-width:120px}
.btn-s{font-size:12.5px;padding:6px 10px;min-width:0}
.btn-row.tight button{flex:0 0 auto;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.day{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .chk{flex:0 0 26px;height:26px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;margin-top:1px}
.day .chk.on{background:var(--green);border-color:var(--green);color:#fff}
.day .dd{flex:0 0 20px;color:var(--muted);font-size:12px;letter-spacing:.06em;margin-top:5px}
.day .tx{flex:1;font-size:14.5px;min-width:0}
.day.today{background:rgba(184,137,59,.08);border-radius:8px;padding-left:6px;padding-right:6px}
.wk{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel);overflow:hidden}
.wk > .hd{display:flex;align-items:center;gap:9px;padding:11px 12px;cursor:pointer}
.wk > .hd .n{font-size:12px;color:var(--muted);letter-spacing:.06em;flex:0 0 auto}
.wk > .hd .t{flex:1;font-size:14.5px;min-width:0}
.wk > .bd{padding:0 12px 10px;display:none}
.wk.open > .bd{display:block}
.bar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:5px}
.bar > i{display:block;height:100%;background:var(--gold);transition:width .25s}
.bar.lg{height:11px}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 12px;font-size:15px;line-height:1.4}
.opt.ok{background:rgba(46,139,87,.22);border-color:var(--green)}
.opt.ko{background:rgba(192,57,43,.22);border-color:var(--red)}
.opt b{color:var(--gold);margin-right:6px}
.expl{margin-top:10px;padding:11px 12px;border-left:3px solid var(--gold);background:var(--panel2);
  border-radius:0 10px 10px 0;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--panel);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:9px 2px 10px;font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
nav button .ic{display:block;font-size:19px;margin-bottom:1px}
nav button.on{color:var(--gold)}
select,input[type=date],input[type=text]{font-family:inherit;font-size:15px;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td{padding:5px 0;border-top:1px solid var(--line);vertical-align:middle}
td:first-child{width:52px;color:var(--muted);font-size:12px}
td:last-child{width:64px;text-align:right;color:var(--muted);font-size:12px}
.warn{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:10px}
.big{font-size:30px;letter-spacing:.02em}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.prog{position:sticky;top:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:9px 12px;margin-bottom:10px;font-size:13px;color:var(--muted);z-index:5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.chip{font-size:12px;letter-spacing:.05em;padding:6px 11px;border-radius:99px;background:var(--panel2);
  border:1px solid var(--line);color:var(--muted);cursor:pointer;font-family:inherit}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1710;font-weight:700}
.pg{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.pg:first-child{border-top:0}
.pg .nm{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg .bw{flex:0 0 96px}
.pg .pc{flex:0 0 46px;text-align:right;font-size:12.5px;color:var(--muted)}
.mini{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.hide{display:none !important}
</style>
</head>
<body>
<header>
  <h1>OPO Nicole</h1>
  <p id="sub">Otorrinolaringología · OPE Servicio Cántabro de Salud</p>
</header>
<main id="app"></main>
<nav>
  <button data-v="hoy" class="on"><span class="ic">📅</span>Hoy</button>
  <button data-v="ses"><span class="ic">🗺️</span>Sesiones</button>
  <button data-v="test"><span class="ic">✅</span>Test</button>
  <button data-v="prog"><span class="ic">📊</span>Progreso</button>
  <button data-v="temario"><span class="ic">📚</span>Temario</button>
</nav>
<script src="data.js"></script>
<script>
(function(){
"use strict";
var D = window.ORL, KEY = "oponicole.orl.v1";
var BN = {OTO:"Otología", LAR:"Laringe", RINO:"Rinología", FAR:"Faringe", GEN:"Parte general", REP:"Repaso"};
var BORDER = ["LAR","RINO","OTO","FAR","GEN"];
var BPESO = {OTO:"45 %", LAR:"27 %", RINO:"20 %", GEN:"15 preguntas", FAR:"7 %", REP:"repaso y simulacros"};
var BLOQ = BORDER.concat(["REP"]);
var DN = {L:"Lun", M:"Mar", X:"Mié", J:"Jue", V:"Vie", S:"Sáb"};
var TT = {}; D.temario.forEach(function(t){ TT[t.id] = t; });

/* ---------- catálogo de sesiones (sin fechas: orden libre) ---------- */
var SES = [], SB = {}, TS = {};
D.plan.forEach(function(w, wi){
  w.d.forEach(function(x, i){
    var s = {k:wi + "-" + i, w:wi, i:i, mod:w.n, b:w.b, tit:w.tit, t:x.t, q:x.q, x:x.x};
    SES.push(s);
    (SB[w.b] = SB[w.b] || []).push(s);
    x.q.forEach(function(id){ (TS[id] = TS[id] || []).push(s); });
  });
});
var NSES = SES.length;

/* ---------- estado ---------- */
var S;
function load(){
  try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ S = null; }
  if(!S) S = {};
  if(!S.start) S.start = iso(today());
  if(!S.done) S.done = {};
  if(!S.qs) S.qs = {};
  if(!S.hist) S.hist = [];
  if(!S.exam) S.exam = "";
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function iso(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function parseISO(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function today(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function addDays(d, n){ var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function fdate(d){ return d.toLocaleDateString("es-ES", {weekday:"long", day:"numeric", month:"long"}); }
function sdate(d){ return d.toLocaleDateString("es-ES", {day:"numeric", month:"short", year:"numeric"}); }

/* ---------- hechas ---------- */
function isDone(k){ return !!S.done[k]; }
function doneDate(k){ var v = S.done[k]; return (typeof v === "string") ? v : null; }
function toggleDone(k){
  if(S.done[k]) delete S.done[k]; else S.done[k] = iso(today());
  save();
}
function prog(list){
  var d = 0;
  list.forEach(function(s){ if(isDone(s.k)) d++; });
  return {d:d, t:list.length, p: list.length ? d*100/list.length : 0};
}
function nextPend(list){
  for(var i=0;i<list.length;i++){ if(!isDone(list[i].k)) return list[i]; }
  return null;
}
function hechasHoy(){
  var h = iso(today());
  return SES.filter(function(s){ return doneDate(s.k) === h; });
}
function streak(){
  var set = {};
  Object.keys(S.done).forEach(function(k){ var v = S.done[k]; if(typeof v === "string") set[v] = 1; });
  var n = 0, d = today();
  if(!set[iso(d)]) d = addDays(d, -1);
  while(set[iso(d)]){ n++; d = addDays(d, -1); }
  return n;
}
function ritmo(){
  var cut = addDays(today(), -27), n = 0, dated = 0;
  Object.keys(S.done).forEach(function(k){
    var v = S.done[k];
    if(typeof v === "string"){ dated++; if(parseISO(v) >= cut) n++; }
  });
  return {n:n, sem: n*7/28, dated:dated};
}
function pctColor(p){ return p >= 60 ? "var(--green)" : p >= 30 ? "var(--gold)" : "var(--red)"; }

/* ---------- preguntas ---------- */
function qsFor(tags){
  if(!tags || !tags.length) return D.q.slice();
  var set = {};
  tags.forEach(function(t){ set[t] = 1; });
  if(set.ALL) return D.q.slice();
  if(set.OPE22) return D.q.filter(function(q){ return q.s === "ope22"; })
                          .sort(function(a,b){ return a.n - b.n; });
  return D.q.filter(function(q){ return set[q.t] || set[q.b]; });
}
function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function stat(id){ return S.qs[id] || {ok:0, ko:0}; }
function falladas(){
  return D.q.filter(function(q){ var s = stat(q.id); return s.ko > 0 && s.ko >= s.ok; });
}
function accum(sel){
  var ok = 0, ko = 0, vistas = 0;
  D.q.filter(sel).forEach(function(q){
    var s = stat(q.id); ok += s.ok; ko += s.ko; if(s.ok || s.ko) vistas++;
  });
  return {ok:ok, ko:ko, v:vistas, t:D.q.filter(sel).length};
}

/* ---------- render helpers ---------- */
var app = document.getElementById("app"), view = "hoy", openTema = null;
var flt = {b:"", pend:false};
function h(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function bar(p, color, lg){
  return '<div class="bar' + (lg ? " lg" : "") + '"><i style="width:' + p.toFixed(1) +
    '%' + (color ? ";background:" + color : "") + '"></i></div>';
}
function pgRow(nombre, p, extra){
  return '<div class="pg"><div class="nm">' + nombre + '</div>' +
    '<div class="bw">' + bar(p.p, pctColor(p.p)) + '</div>' +
    '<div class="pc">' + Math.round(p.p) + '%</div></div>' +
    (extra ? '<div class="mini" style="margin:-4px 0 4px">' + extra + '</div>' : "");
}
function temaTags(q){
  return q.map(function(id){ return '<span class="tag">' + h(id) + '</span>'; }).join(" ");
}
function sesRow(s, withMod){
  var d = doneDate(s.k);
  return '<div class="day" data-txt="' + h((s.t + " " + s.q.join(" ") + " " + s.tit + " M" + s.mod).toLowerCase()) + '">' +
    '<div class="chk' + (isDone(s.k) ? " on" : "") + '" data-done="' + s.k + '">' + (isDone(s.k) ? "✓" : "") + '</div>' +
    '<div class="tx">' +
    (withMod ? '<span class="tag ' + s.b + '">M' + s.mod + '</span> ' : "") + temaTags(s.q) +
    (s.x === "S" ? ' <span class="tag REP">Repaso</span>' : "") +
    '<div style="margin-top:3px">' + h(s.t) + '</div>' +
    (d ? '<div class="mini">Hecha el ' + h(sdate(parseISO(d))) + '</div>' : "") +
    '<div class="btn-row tight"><button class="btn-s" data-go="dtest" data-tags="' + h(s.q.join(",")) +
    '">Test de esta sesión</button></div></div></div>';
}
document.querySelectorAll("nav button").forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll("nav button").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on"); view = b.dataset.v; test = null; openTema = null; render();
  };
});
function bindDone(){
  app.querySelectorAll("[data-done]").forEach(function(b){
    b.onclick = function(){ toggleDone(b.dataset.done); render(); };
  });
}
function bindGo(){
  app.querySelectorAll("[data-go]").forEach(function(b){
    b.onclick = function(){
      var g = b.dataset.go;
      if(g === "fall"){ startTest(shuffle(falladas()).slice(0,20), "Repaso de falladas"); }
      else if(g === "sim"){ startTest(simAleatorio(), "Simulacro aleatorio (110)"); }
      else if(g === "dtest"){
        var tags = b.dataset.tags.split(",");
        startTest(shuffle(qsFor(tags)).slice(0,15), b.dataset.nom || "Test de la sesión");
      }
      else if(g === "view"){ goView(b.dataset.arg); }
      else if(g === "tema"){ openTema = b.dataset.arg; goView("temario"); }
    };
  });
}
function goView(v){
  view = v; test = null;
  document.querySelectorAll("nav button").forEach(function(x){
    x.classList.toggle("on", x.dataset.v === v);
  });
  render();
}

/* ---------- vista HOY ---------- */
function vHoy(){
  var g = prog(SES), hoy = hechasHoy(), st = streak(), r = ritmo(), out = "";

  out += '<div class="card"><h2>' + h(fdate(today())) + '</h2>' +
    '<p class="muted" style="margin:0">Elige lo que quieras estudiar hoy. No hay orden obligatorio: ' +
    'puedes saltar de bloque, dejar un tema a medias y retomarlo otro día.</p>' +
    '<div class="kv" style="margin-top:10px"><span>Sesiones hechas hoy</span><b>' + hoy.length + '</b></div>' +
    '<div class="kv"><span>Días seguidos estudiando</span><b>' + st + '</b></div>' +
    '<div class="kv"><span>Ritmo (últimas 4 semanas)</span><b>' + (r.dated ? r.sem.toFixed(1) + " sesiones/semana" : "—") + '</b></div></div>';

  var np = nextPend(SES);
  if(np){
    out += '<div class="card"><h2>Seguir donde lo dejaste</h2>' +
      '<p class="muted" style="margin:0 0 6px">Sugerencia, no obligación · <span class="tag ' + np.b + '">' + h(BN[np.b]) +
      '</span> <span class="tag">Módulo ' + np.mod + '</span></p>' +
      '<p style="font-size:16px;margin:0">' + h(np.t) + '</p>' +
      '<div class="btn-row"><button class="btn-main" data-go="dtest" data-tags="' + h(np.q.join(",")) + '">Test de esta sesión</button>' +
      '<button data-done="' + np.k + '">Marcar hecha</button>' +
      '<button data-go="view" data-arg="ses">Elegir otra</button></div></div>';
  } else {
    out += '<div class="card"><h2>Temario completo</h2><p class="muted">Has marcado las ' + NSES +
      ' sesiones. Ahora toca simulacros y falladas.</p>' +
      '<div class="btn-row"><button class="btn-main" data-go="sim">Simulacro (110)</button>' +
      '<button data-go="fall">Falladas</button></div></div>';
  }

  out += '<div class="card"><h2>Alternar bloque</h2>' +
    '<p class="muted" style="margin:0 0 4px">Lo siguiente pendiente de cada bloque, para ir mezclando.</p>';
  BLOQ.forEach(function(b){
    var p = prog(SB[b] || []), n = nextPend(SB[b] || []);
    out += '<div class="day"><div class="tx">' +
      '<span class="tag ' + b + '">' + h(BN[b]) + '</span> <span class="mini">' + p.d + "/" + p.t + ' · ' + Math.round(p.p) + '%</span>' +
      bar(p.p, pctColor(p.p)) +
      (n ? '<div style="margin-top:6px;font-size:14px">' + h(n.t) + '</div>' +
           '<div class="btn-row tight"><button class="btn-s btn-main" data-go="dtest" data-tags="' + h(n.q.join(",")) + '">Test</button>' +
           '<button class="btn-s" data-done="' + n.k + '">Marcar hecha</button></div>'
         : '<div class="mini" style="margin-top:6px">Bloque terminado ✓</div>') +
      '</div></div>';
  });
  out += '</div>';

  out += '<div class="card"><h2>Ir a un tema concreto</h2>' +
    '<select id="jt"><option value="">Elige un tema del temario…</option>';
  BORDER.forEach(function(b){
    out += '<optgroup label="' + h(BN[b]) + '">';
    D.temario.filter(function(t){ return t.b === b; }).forEach(function(t){
      var p = prog(TS[t.id] || []);
      out += '<option value="' + t.id + '">' + h(t.id + " · " + t.t.slice(0,58)) + " (" + Math.round(p.p) + "%)" + '</option>';
    });
    out += '</optgroup>';
  });
  out += '</select><div class="btn-row"><button id="jtGo">Abrir el tema</button>' +
    '<button data-go="view" data-arg="temario">Ver todo el temario</button></div></div>';

  out += '<div class="card"><h2>Progreso del temario</h2>' +
    '<p class="big" style="margin:4px 0">' + Math.round(g.p) + '%</p>' + bar(g.p, "var(--gold)", true) +
    '<div class="kv" style="margin-top:8px"><span>Sesiones marcadas</span><b>' + g.d + " / " + g.t + '</b></div>' +
    '<div class="btn-row"><button data-go="view" data-arg="prog">Ver estimación y detalle</button></div></div>';

  if(hoy.length){
    out += '<div class="card"><h2>Hecho hoy</h2>';
    hoy.forEach(function(s){ out += sesRow(s, true); });
    out += '</div>';
  }
  app.innerHTML = out;
  var jt = document.getElementById("jt");
  document.getElementById("jtGo").onclick = function(){
    if(jt.value){ openTema = jt.value; goView("temario"); }
  };
  bindDone(); bindGo();
}

/* ---------- vista SESIONES (catálogo libre) ---------- */
function vSes(){
  var g = prog(SES), out = "";
  out += '<div class="card"><h2>Todas las sesiones</h2>' +
    '<p class="muted" style="margin:0">' + NSES + ' sesiones agrupadas en ' + D.plan.length +
    ' módulos temáticos. El orden de los módulos es solo una sugerencia (laringe y rinología primero por ser lo ' +
    'más reciente, otología después por ser el 45 % del examen): puedes hacerlos en el orden que quieras, ' +
    'alternarlos o dejar uno a medias.</p>' +
    '<div class="kv" style="margin-top:10px"><span>Hechas</span><b>' + g.d + " / " + g.t + ' · ' + Math.round(g.p) + '%</b></div>' +
    bar(g.p, "var(--gold)", true) +
    '<h3>Filtrar</h3><div class="chips">' +
    '<button class="chip' + (flt.b === "" ? " on" : "") + '" data-flt="">Todos</button>';
  BLOQ.forEach(function(b){
    var p = prog(SB[b] || []);
    out += '<button class="chip' + (flt.b === b ? " on" : "") + '" data-flt="' + b + '">' +
      h(BN[b]) + ' ' + Math.round(p.p) + '%</button>';
  });
  out += '</div><div class="chips">' +
    '<button class="chip' + (flt.pend ? " on" : "") + '" data-pend="1">Solo pendientes</button></div>' +
    '<div style="margin-top:8px"><input type="text" id="q" placeholder="Buscar: colesteatoma, T21, vértigo…"></div></div>';

  var vistos = 0;
  D.plan.forEach(function(w, wi){
    if(flt.b && w.b !== flt.b) return;
    var list = SES.filter(function(s){ return s.w === wi; });
    var shown = flt.pend ? list.filter(function(s){ return !isDone(s.k); }) : list;
    if(!shown.length) return;
    vistos++;
    var p = prog(list);
    out += '<div class="wk" data-wk="' + wi + '">' +
      '<div class="hd"><span class="n">M' + w.n + '</span><span class="t">' + h(w.tit) + '</span>' +
      '<span class="tag ' + w.b + '">' + h(BN[w.b]) + '</span>' +
      '<span class="n">' + p.d + '/' + p.t + '</span></div>' +
      '<div class="bd">' + bar(p.p, pctColor(p.p)) +
      '<div class="btn-row tight" style="margin-bottom:4px">' +
      '<button class="btn-s" data-go="dtest" data-tags="' + h(uniqTemas(list).join(",")) +
      '" data-nom="Módulo ' + w.n + ' · ' + h(w.tit) + '">Test de todo el módulo</button>' +
      '<button class="btn-s" data-mod="' + wi + '">' + (p.d === p.t ? "Desmarcar módulo" : "Marcar módulo entero") + '</button></div>';
    shown.forEach(function(s){ out += sesRow(s, false); });
    out += '</div></div>';
  });
  if(!vistos) out += '<div class="card"><p class="muted" style="margin:0">Nada pendiente con ese filtro.</p></div>';

  app.innerHTML = out;
  app.querySelectorAll(".wk > .hd").forEach(function(hd){
    hd.onclick = function(){ hd.parentNode.classList.toggle("open"); };
  });
  app.querySelectorAll("[data-flt]").forEach(function(b){
    b.onclick = function(){ flt.b = b.dataset.flt; render(); };
  });
  app.querySelectorAll("[data-pend]").forEach(function(b){
    b.onclick = function(){ flt.pend = !flt.pend; render(); };
  });
  app.querySelectorAll("[data-mod]").forEach(function(b){
    b.onclick = function(){
      var wi = +b.dataset.mod, list = SES.filter(function(s){ return s.w === wi; });
      var todas = list.every(function(s){ return isDone(s.k); }), hoyIso = iso(today());
      list.forEach(function(s){ if(todas) delete S.done[s.k]; else S.done[s.k] = S.done[s.k] || hoyIso; });
      save(); render();
    };
  });
  var inp = document.getElementById("q");
  inp.oninput = function(){
    var v = inp.value.trim().toLowerCase();
    app.querySelectorAll(".wk").forEach(function(wk){
      var any = false;
      wk.querySelectorAll("[data-txt]").forEach(function(r){
        var m = !v || r.dataset.txt.indexOf(v) >= 0;
        r.classList.toggle("hide", !m);
        if(m) any = true;
      });
      wk.classList.toggle("hide", !any);
      if(v && any) wk.classList.add("open");
    });
  };
  bindDone(); bindGo();
}
function uniqTemas(list){
  var set = {}, res = [];
  list.forEach(function(s){ s.q.forEach(function(id){ if(!set[id]){ set[id] = 1; res.push(id); } }); });
  return res;
}

/* ---------- vista TEMARIO ---------- */
function vTemario(){
  var out = '<div class="card"><h2>Temario oficial</h2>' +
    '<p class="muted">Anexo I de la Orden SAN/62/2022 (BOC nº 7, 11-I-2023), categoría FEA de Otorrinolaringología. ' +
    'Cada tema lleva su propio porcentaje: sesiones marcadas sobre las que lo cubren. Ábrelo y estudia el que ' +
    'quieras, cuando quieras.</p></div>';
  BORDER.forEach(function(b){
    var lista = D.temario.filter(function(t){ return t.b === b; });
    var sesB = prog(SB[b] || []);
    out += '<div class="card"><h2>' + h(BN[b]) + ' <span class="mini">· ' + h(BPESO[b] || "") + '</span></h2>' +
      '<div class="kv"><span>Avance del bloque</span><b>' + sesB.d + " / " + sesB.t + ' sesiones · ' + Math.round(sesB.p) + '%</b></div>' +
      bar(sesB.p, pctColor(sesB.p), true) + '<div style="height:8px"></div>';
    lista.forEach(function(t){
      var ses = TS[t.id] || [], p = prog(ses);
      var a = accum(function(q){ return q.t === t.id; });
      var acc = (a.ok + a.ko) ? Math.round(a.ok*100/(a.ok+a.ko)) : null;
      var nq = D.q.filter(function(q){ return q.t === t.id; }).length;
      var ofi = D.q.filter(function(q){ return q.t === t.id && q.s === "ope22"; }).length;
      var op = (openTema === t.id);
      out += '<div class="wk' + (op ? " open" : "") + '" data-tema="' + t.id + '">' +
        '<div class="hd"><span class="n">' + h(t.id) + '</span><span class="t">' + h(t.t) + '</span>' +
        '<span class="n">' + Math.round(p.p) + '%</span></div>' +
        '<div class="bd">' + bar(p.p, pctColor(p.p)) +
        '<p class="mini" style="margin:6px 0 2px">' + p.d + " de " + p.t + ' sesiones hechas · ' + nq +
        ' preguntas (' + ofi + ' del examen de 2022)' + (acc === null ? "" : ' · acierto ' + acc + '%') + '</p>' +
        '<div class="btn-row tight"><button class="btn-s btn-main" data-go="dtest" data-tags="' + h(t.id) +
        '" data-nom="' + h(t.id + " · " + t.t.slice(0,40)) + '">Test del tema</button></div>';
      ses.forEach(function(s){ out += sesRow(s, true); });
      if(!ses.length) out += '<p class="mini">Sin sesiones asignadas; practica con el test del tema.</p>';
      out += '</div></div>';
    });
    out += '</div>';
  });
  app.innerHTML = out;
  app.querySelectorAll(".wk > .hd").forEach(function(hd){
    hd.onclick = function(){ hd.parentNode.classList.toggle("open"); };
  });
  bindDone(); bindGo();
  if(openTema){
    var n = app.querySelector('[data-tema="' + openTema + '"]');
    if(n) n.scrollIntoView({block:"center"});
    openTema = null;
    return;
  }
}

/* ---------- vista TEST ---------- */
function simAleatorio(){
  var cupo = {OTO:43, LAR:26, RINO:19, GEN:15, FAR:7}, res = [];
  Object.keys(cupo).forEach(function(b){
    res = res.concat(shuffle(D.q.filter(function(q){ return q.b === b; })).slice(0, cupo[b]));
  });
  return shuffle(res);
}
function vTestMenu(){
  var f = falladas().length;
  var out = '<div class="card"><h2>Practicar</h2>' +
    '<p class="muted">' + D.q.length + ' preguntas: 110 del examen oficial de 2022 y ' +
    (D.q.length - 110) + ' propias para cubrir los temas que no cayeron.</p>' +
    '<h3>Por bloque</h3><div class="grid">';
  ["OTO","LAR","RINO","FAR","GEN"].forEach(function(b){
    out += '<button data-t="' + b + '">' + h(BN[b]) + ' <span class="muted">(' +
      D.q.filter(function(q){ return q.b === b; }).length + ')</span></button>';
  });
  out += '</div><h3>Por tema</h3><select id="selT"><option value="">Elige un tema…</option>';
  D.temario.forEach(function(t){
    out += '<option value="' + t.id + '">' + h(t.id + " · " + t.t.slice(0,60)) + '</option>';
  });
  out += '</select><div class="btn-row"><button id="goT">Empezar test del tema</button></div>' +
    '<h3>Simulacros</h3><div class="btn-row">' +
    '<button class="btn-main" data-t="OPE22">Examen oficial OPE 2022 (110)</button>' +
    '<button data-go="sim">Simulacro aleatorio (110)</button></div>' +
    '<h3>Repaso</h3><div class="btn-row">' +
    '<button data-go="fall">Falladas (' + f + ')</button>' +
    '<button data-t="ALL">Aleatorio de todo</button></div>' +
    '<div class="warn">Las respuestas de las 110 preguntas oficiales son una clave propuesta, no la plantilla ' +
    'oficial (el BOC no la publicó junto al cuadernillo). Cinco preguntas están marcadas como discutibles.</div>' +
    '</div>';
  app.innerHTML = out;
  app.querySelectorAll("[data-t]").forEach(function(b){
    b.onclick = function(){
      var t = b.dataset.t;
      if(t === "OPE22") startTest(qsFor(["OPE22"]), "Examen oficial OPE 2022");
      else if(t === "ALL") startTest(shuffle(D.q).slice(0,40), "Test aleatorio");
      else startTest(shuffle(qsFor([t])).slice(0,30), BN[t]);
    };
  });
  document.getElementById("goT").onclick = function(){
    var v = document.getElementById("selT").value;
    if(v) startTest(shuffle(qsFor([v])), TT[v] ? (v + " · " + TT[v].t) : v);
  };
  bindGo();
}

var test = null;
function startTest(list, name){
  if(!list.length){ alert("No hay preguntas para esa selección."); return; }
  test = {l:list, i:0, ok:0, ko:0, name:name, ans:null, wrong:[]};
  view = "test"; render();
}
function vTest(){
  var t = test, q = t.l[t.i];
  var out = '<div class="prog">' + h(t.name) + ' · ' + (t.i+1) + " / " + t.l.length +
    ' · <span style="color:var(--green)">' + t.ok + '</span> / <span style="color:var(--red)">' + t.ko + '</span>' +
    '<div class="bar"><i style="width:' + ((t.i)*100/t.l.length).toFixed(1) + '%"></i></div></div>';
  out += '<div class="card"><p class="muted" style="margin:0 0 6px">' +
    '<span class="tag ' + q.b + '">' + h(q.t) + '</span> ' +
    (q.s === "ope22" ? '<span class="tag">OPE 2022 · nº ' + q.n + '</span>' : '<span class="tag">Propia</span>') +
    (q.d ? ' <span class="tag" style="color:var(--red);border-color:var(--red)">Discutible</span>' : '') + '</p>' +
    '<p style="font-size:16.5px;margin:0 0 10px">' + h(q.q) + '</p><div id="opts">';
  ["A","B","C","D"].forEach(function(L, i){
    out += '<button class="opt" data-o="' + L + '"><b>' + L + '</b>' + h(q.o[i]) + '</button>';
  });
  out += '</div><div id="fb"></div></div>';
  app.innerHTML = out;
  app.querySelectorAll(".opt").forEach(function(b){
    b.onclick = function(){ answer(b.dataset.o); };
  });
}
function answer(L){
  var t = test, q = t.l[t.i], good = (L === q.r);
  var st = S.qs[q.id] || {ok:0, ko:0};
  if(good){ t.ok++; st.ok++; } else { t.ko++; st.ko++; t.wrong.push(q); }
  st.last = Date.now(); S.qs[q.id] = st; save();
  app.querySelectorAll(".opt").forEach(function(b){
    b.disabled = true;
    if(b.dataset.o === q.r) b.classList.add("ok");
    else if(b.dataset.o === L) b.classList.add("ko");
  });
  var fb = document.getElementById("fb");
  fb.innerHTML = '<div class="expl"><b style="color:' + (good ? "var(--green)" : "var(--red)") + '">' +
    (good ? "Correcta" : "Incorrecta · la respuesta es " + q.r) + '.</b> ' + h(q.e) +
    (q.d ? ' <i style="color:var(--muted)">(pregunta con respuesta discutible: contrástala en el manual)</i>' : '') +
    '</div><div class="btn-row"><button class="btn-main" id="next">' +
    (t.i + 1 < t.l.length ? "Siguiente" : "Ver resultado") + '</button>' +
    '<button id="quit">Salir</button></div>';
  document.getElementById("next").onclick = function(){
    t.i++;
    if(t.i >= t.l.length) endTest(); else { render(); window.scrollTo(0,0); }
  };
  document.getElementById("quit").onclick = function(){ test = null; view = "test"; render(); };
  fb.scrollIntoView({behavior:"smooth", block:"nearest"});
}
function endTest(){
  var t = test, pct = Math.round(t.ok*100/t.l.length);
  S.hist.unshift({ts:Date.now(), n:t.name, ok:t.ok, tot:t.l.length});
  S.hist = S.hist.slice(0,40); save();
  var out = '<div class="card"><h2>Resultado</h2>' +
    '<p class="big" style="margin:4px 0">' + t.ok + " / " + t.l.length + ' <span class="muted" style="font-size:16px">(' + pct + '%)</span></p>' +
    '<div class="bar"><i style="width:' + pct + '%;background:' + (pct >= 50 ? "var(--green)" : "var(--red)") + '"></i></div>' +
    '<p class="muted" style="margin-top:10px">' + h(t.name) + '</p>' +
    '<div class="btn-row"><button class="btn-main" id="rep">Repasar los ' + t.wrong.length + ' fallos</button>' +
    '<button id="back">Volver</button></div></div>';
  if(t.wrong.length){
    out += '<div class="card"><h2>Fallos</h2>';
    t.wrong.forEach(function(q){
      out += '<div class="day"><div class="dd" style="flex:0 0 42px">' + h(q.t) + '</div><div class="tx">' +
        h(q.q) + '<div class="expl">Respuesta ' + q.r + '. ' + h(q.e) + '</div></div></div>';
    });
    out += '</div>';
  }
  app.innerHTML = out;
  document.getElementById("back").onclick = function(){ test = null; view = "test"; render(); };
  document.getElementById("rep").onclick = function(){
    if(t.wrong.length) startTest(shuffle(t.wrong), "Repaso de fallos");
    else { test = null; view = "test"; render(); }
  };
  test = null;
  window.scrollTo(0,0);
}

/* ---------- vista PROGRESO ---------- */
function vProg(){
  var g = prog(SES), r = ritmo(), rest = g.t - g.d, out = "";

  out += '<div class="card"><h2>Temario completado</h2>' +
    '<p class="big" style="margin:4px 0">' + Math.round(g.p) + '%</p>' + bar(g.p, "var(--gold)", true) +
    '<div class="kv" style="margin-top:8px"><span>Sesiones hechas</span><b>' + g.d + " / " + g.t + '</b></div>' +
    '<div class="kv"><span>Pendientes</span><b>' + rest + '</b></div>' +
    '<div class="kv"><span>Días seguidos</span><b>' + streak() + '</b></div></div>';

  out += '<div class="card"><h2>Estimación</h2>';
  if(!r.dated){
    out += '<p class="muted" style="margin:0">Marca algunas sesiones como hechas y aquí aparecerá tu ritmo real ' +
      'y la fecha estimada de terminar el temario.</p>';
  } else if(r.sem < 0.5){
    out += '<p class="muted" style="margin:0">En las últimas 4 semanas has hecho ' + r.n + ' sesiones: ' +
      'demasiado poco para estimar una fecha. Con 6 sesiones por semana el temario sale en ' +
      Math.ceil(rest/6) + ' semanas.</p>';
  } else {
    var sem = rest / r.sem, fin = addDays(today(), Math.ceil(sem*7));
    out += '<div class="kv"><span>Ritmo real (4 últimas semanas)</span><b>' + r.sem.toFixed(1) + ' ses./sem.</b></div>' +
      '<div class="kv"><span>A este ritmo terminas en</span><b>' + Math.ceil(sem) + ' semanas</b></div>' +
      '<div class="kv"><span>Fecha estimada de fin</span><b>' + h(sdate(fin)) + '</b></div>';
  }
  if(S.exam){
    var dx = Math.round((parseISO(S.exam) - today()) / 86400000);
    if(dx > 0){
      var semx = dx/7, need = rest/semx;
      out += '<div class="kv"><span>Días hasta el examen</span><b>' + dx + '</b></div>' +
        '<div class="kv"><span>Ritmo necesario</span><b>' + need.toFixed(1) + ' ses./sem.</b></div>';
      var okp = (r.sem >= need);
      out += '<div class="warn" style="border-style:solid;border-color:' + (okp ? "var(--green)" : "var(--red)") + '">' +
        (r.dated && r.sem >= 0.5
          ? (okp ? "Vas sobrada: tu ritmo actual (" + r.sem.toFixed(1) + ") cubre el necesario (" + need.toFixed(1) + ")."
                 : "Vas justa: necesitas " + need.toFixed(1) + " sesiones por semana y llevas " + r.sem.toFixed(1) + ".")
          : "Con " + need.toFixed(1) + " sesiones por semana llegas al examen con el temario terminado.") +
        '</div>';
    } else {
      out += '<div class="kv"><span>Fecha del examen</span><b>' + h(sdate(parseISO(S.exam))) + '</b></div>';
    }
  } else {
    out += '<p class="muted" style="margin:8px 0 0">Pon la fecha del examen en Ajustes y calculo el ritmo que necesitas.</p>';
  }
  out += '</div>';

  out += '<div class="card"><h2>Por bloque</h2>';
  BLOQ.forEach(function(b){
    var p = prog(SB[b] || []), a = accum(function(q){ return q.b === b; });
    var acc = (a.ok + a.ko) ? Math.round(a.ok*100/(a.ok+a.ko)) : null;
    out += pgRow('<span class="tag ' + b + '">' + h(BN[b]) + '</span>', p,
      p.d + "/" + p.t + " sesiones · peso " + (BPESO[b] || "—") +
      (acc === null ? " · sin test aún" : " · acierto " + acc + "%"));
  });
  out += '</div>';

  out += '<div class="card"><h2>Por tema del temario</h2><p class="muted" style="margin:0 0 6px">' +
    'Porcentaje = sesiones hechas de ese tema. Aparecen los 52 temas, estudiados o no.</p>';
  BORDER.forEach(function(b){
    out += '<h3>' + h(BN[b]) + '</h3>';
    D.temario.filter(function(t){ return t.b === b; }).forEach(function(t){
      var p = prog(TS[t.id] || []);
      var a = accum(function(q){ return q.t === t.id; });
      var acc = (a.ok + a.ko) ? Math.round(a.ok*100/(a.ok+a.ko)) : null;
      out += '<div class="pg"><div class="nm"><b class="mini">' + h(t.id) + '</b> ' + h(t.t.slice(0,48)) +
        (acc === null ? "" : ' <span class="mini">(' + acc + '% acierto)</span>') + '</div>' +
        '<div class="bw">' + bar(p.p, pctColor(p.p)) + '</div>' +
        '<div class="pc">' + Math.round(p.p) + '%</div></div>';
    });
  });
  out += '</div>';

  var gq = accum(function(){ return true; });
  out += '<div class="card"><h2>Rendimiento en test</h2>' +
    '<p class="big" style="margin:4px 0">' + (gq.ok + gq.ko ? Math.round(gq.ok*100/(gq.ok+gq.ko)) : 0) + '%</p>' +
    '<div class="kv"><span>Acertadas</span><b>' + gq.ok + '</b></div>' +
    '<div class="kv"><span>Falladas</span><b>' + gq.ko + '</b></div>' +
    '<div class="kv"><span>Preguntas ya vistas</span><b>' + gq.v + " / " + gq.t + '</b></div>' +
    '<div class="kv"><span>Pendientes de repaso</span><b>' + falladas().length + '</b></div>' +
    '<div class="btn-row"><button data-go="fall">Repasar falladas</button></div></div>';

  if(S.hist.length){
    out += '<div class="card"><h2>Últimos tests</h2>';
    S.hist.slice(0,12).forEach(function(x){
      out += '<div class="kv"><span>' + new Date(x.ts).toLocaleDateString("es-ES") + ' · ' + h(x.n) +
        '</span><b>' + x.ok + "/" + x.tot + '</b></div>';
    });
    out += '</div>';
  }

  out += '<div class="card"><h2>Ajustes</h2>' +
    '<h3>Fecha del examen (opcional)</h3><p class="muted" style="margin-top:0">Solo se usa para calcular el ritmo ' +
    'necesario. No bloquea ni reordena nada.</p>' +
    '<input type="date" id="ex" value="' + h(S.exam) + '">' +
    '<div class="btn-row"><button id="setEx">Guardar</button><button id="clrEx">Quitar fecha</button></div>' +
    '<h3>Primer día de estudio</h3><p class="muted" style="margin-top:0">Informativo, para el histórico.</p>' +
    '<input type="date" id="st" value="' + S.start + '">' +
    '<div class="btn-row"><button id="setSt">Guardar</button></div>' +
    '<h3>Datos</h3><div class="btn-row"><button id="rs">Reiniciar progreso</button></div>' +
    '<div class="warn">Todo se guarda solo en este dispositivo (localStorage). ' +
    'El temario procede de la convocatoria publicada en el BOC nº 7 de 11-I-2023; si la nueva convocatoria ' +
    'cambia algún tema, habrá que ajustar el contenido.</div></div>';

  app.innerHTML = out;
  document.getElementById("setEx").onclick = function(){
    S.exam = document.getElementById("ex").value || ""; save(); render();
  };
  document.getElementById("clrEx").onclick = function(){ S.exam = ""; save(); render(); };
  document.getElementById("setSt").onclick = function(){
    var v = document.getElementById("st").value;
    if(v){ S.start = v; save(); render(); }
  };
  document.getElementById("rs").onclick = function(){
    if(confirm("¿Borrar el progreso, las estadísticas y el historial?")){
      S = {start:S.start, exam:S.exam, done:{}, qs:{}, hist:[]}; save(); render();
    }
  };
  bindGo();
}

/* ---------- router ---------- */
function render(){
  if(test){ vTest(); return; }
  if(view === "hoy") vHoy();
  else if(view === "ses") vSes();
  else if(view === "test") vTestMenu();
  else if(view === "prog") vProg();
  else vTemario();
  if(view !== "test" && view !== "temario") window.scrollTo(0,0);
}
load();
document.getElementById("sub").textContent =
  "ORL · OPE Servicio Cántabro de Salud · " + D.q.length + " preguntas · " + NSES + " sesiones";
render();
})();
</script>

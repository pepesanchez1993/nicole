<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Registro de entrenamientos: rutinas editables de gimnasio y pilates, series con PR, progreso y racha.">
<meta name="theme-color" content="#F1F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101317" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<title>NICOLEGYM</title>
<style>
/* ============ tokens ============ */
:root{
  --ground:#F1F3F5; --surface:#FFFFFF; --surface-2:#F5F7F8; --surface-3:#E9EDF0;
  --line:#DCE1E5; --line-2:#C3CBD1;
  --ink:#14181C; --ink-2:#3D464E; --muted:#6E7982; --faint:#98A2AA;
  --red:#C93C2C; --blue:#2160A8; --yellow:#A87908; --green:#1B7A45;
  --good:#1B7A45; --on:#FFFFFF;
  --shadow:0 1px 2px rgba(20,24,28,.06), 0 10px 26px -18px rgba(20,24,28,.3);
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#101317; --surface:#181C21; --surface-2:#1F242A; --surface-3:#262C33;
  --line:#2A3138; --line-2:#3A434C;
  --ink:#E9ECEF; --ink-2:#C2C9CF; --muted:#8E979F; --faint:#6C757D;
  --red:#F0594A; --blue:#5397E4; --yellow:#D4A23A; --green:#34A96A;
  --good:#34A96A; --on:#0E1114;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --ground:#101317; --surface:#181C21; --surface-2:#1F242A; --surface-3:#262C33;
  --line:#2A3138; --line-2:#3A434C;
  --ink:#E9ECEF; --ink-2:#C2C9CF; --muted:#8E979F; --faint:#6C757D;
  --red:#F0594A; --blue:#5397E4; --yellow:#D4A23A; --green:#34A96A;
  --good:#34A96A; --on:#0E1114;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:left}
h1,h2,h3,h4,p{margin:0}
.app{max-width:640px;margin:0 auto;padding:0 14px calc(104px + env(safe-area-inset-bottom))}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ============ cabecera ============ */
.top{display:flex;align-items:center;gap:10px;padding:max(18px,env(safe-area-inset-top)) 0 12px}
.top h1{font-size:23px;font-weight:800;letter-spacing:.04em;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.pill .i{width:16px;height:16px}
.pill.fire{color:var(--red)}
.pill.fire.off{color:var(--faint)}

/* ============ navegación inferior ============ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:12px;font-weight:600;color:var(--muted)}
.tab .i{width:23px;height:23px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] .i{color:var(--red)}

/* ============ piezas comunes ============ */
.view{display:none}.view.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px}
.sec{margin-top:22px}
.sec>h2{font-size:19px;font-weight:750;margin-bottom:3px}
.hint{color:var(--muted);font-size:14px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line-2);font-weight:650;font-size:15px;color:var(--ink);text-align:center}
.btn:active{transform:scale(.98)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.btn.dash{border-style:dashed;color:var(--muted);width:100%;background:transparent}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn .i{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--surface);font-weight:600;font-size:14.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--on)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.prog{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--good));transition:width .25s}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14.5px}
input[type=text],input[type=number],input[type=search],select{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--surface-2);padding:0 12px;font-size:16px}
input::placeholder{color:var(--faint)}

/* ============ HOY · semana ============ */
.datebar{display:flex;align-items:center;gap:8px}
.datebar .nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.datebtn{position:relative;flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15.5px;text-align:center;overflow:hidden}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;cursor:pointer}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 4px}
.wkd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;border-radius:12px;border:1px solid transparent;background:var(--surface);
  --c:var(--line-2)}
.wkd small{font-size:11.5px;font-weight:650;color:var(--muted);text-transform:uppercase}
.wkd b{font-size:16px}
.wkd i{width:10px;height:10px;border-radius:50%;border:2px solid var(--c);background:transparent}
.wkd.rest i{border-style:dashed;border-color:var(--line-2)}
.wkd.done i{background:var(--c)}
.wkd.sel{border-color:var(--ink)}
.wkd.today b{color:var(--red)}

/* ============ HOY · sesión ============ */
.sess{margin-top:14px;padding:16px;border-left:6px solid var(--c)}
.sess small{display:block;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sess h2{font-size:23px;font-weight:800;line-height:1.15;margin:3px 0 0}
.sess-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.sess .prog{margin:14px 0 6px}
.sess .ptxt{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);font-weight:600}
.sess .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.blk{margin-top:12px;overflow:hidden}
.blk-h{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px}
.num{width:30px;height:30px;border-radius:50%;background:var(--c);color:var(--on);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.blk.full .num{background:var(--good)}
.bt{flex:1;min-width:0}.bt b{display:block;font-size:17px}.bt small{color:var(--muted);font-size:13px}
.cnt{font-size:13.5px;font-weight:700;color:var(--muted)}
.chev{transition:transform .2s;color:var(--muted)}
.blk.shut .chev{transform:rotate(-90deg)}
.blk-b{border-top:1px solid var(--line);padding:6px 10px 12px}
.blk.shut .blk-b{display:none}
.blk-b .btn.dash{margin-top:8px}

.item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 6px;border-radius:0}
.item+.item{border-top:1px solid var(--line)}
.tick{width:34px;height:34px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;color:transparent;flex:none;background:var(--surface)}
.tick .i{width:18px;height:18px;stroke-width:3}
.on>.tick,.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.it{flex:1;min-width:0}.it b{display:block;font-size:16px;font-weight:650}.it small{display:block;color:var(--muted);font-size:13.5px;line-height:1.3}
.item em{font-style:normal;font-size:13.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.item.on .it b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}

.ex{border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex-h{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px}
.ex-h .it small b{display:inline;font-size:inherit;color:var(--ink-2)}
.ex-b{padding:0 2px 12px}
.ex .cue{font-size:13.5px;color:var(--muted);margin:0 2px 8px}
.ref{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted);margin:0 2px 10px}
.ref b{color:var(--ink-2)}
.badge{display:inline-block;background:var(--c);color:var(--on);border-radius:99px;font-size:12px;font-weight:800;padding:2px 9px;letter-spacing:.03em}
.srow{display:grid;grid-template-columns:54px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:7px}
.srow.m-bw,.srow.m-time{grid-template-columns:54px 1fr 44px}
.srow.head{margin-top:0;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center}
.srow.head span:first-child{text-align:left}
.srow input{text-align:center;font-weight:700;min-height:46px}
.srow .slab{font-weight:750;color:var(--muted);font-size:14.5px}
.srow.pr .slab{color:var(--c);font-weight:850}
.srow.pr input{border-color:color-mix(in srgb,var(--c) 55%,var(--line-2));background:color-mix(in srgb,var(--c) 8%,var(--surface-2))}
.srow .tick{width:44px;height:44px;border-radius:12px}
.srow.done input{opacity:.75}
.link{font-size:13.5px;font-weight:700;color:var(--blue);padding:8px 2px}
.restcard{margin-top:14px;padding:26px 18px;text-align:center}
.restcard h2{font-size:21px;margin-bottom:6px}.restcard p{color:var(--muted);margin-bottom:16px}
.cardio-opts{margin:6px 4px 10px}
.bigcheck{display:flex;align-items:center;gap:12px;width:100%;padding:12px 8px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.bigcheck.on{background:color-mix(in srgb,var(--good) 12%,var(--surface));border-color:var(--good)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 2px 10px}
.mode{padding:14px 6px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface);text-align:center;font-weight:750}
.mode small{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:2px}
.mode[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on)}
.mode[aria-pressed="true"] small{color:inherit;opacity:.85}
.foot{margin-top:18px;display:flex;justify-content:center}

/* ============ PLAN ============ */
.days{display:grid;gap:10px}
.drow{padding:12px 14px}
.drow-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.drow-h b{font-size:17px}
.drow-h span{font-size:13.5px;color:var(--muted);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-3);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:40px;border-radius:9px;text-align:center;font-weight:700;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.drow .chips{margin-top:10px}
.rt{margin-top:10px;overflow:hidden}
.rt-h{display:flex;align-items:center;gap:12px;width:100%;padding:14px}
.rt-h .bar{width:6px;align-self:stretch;border-radius:4px;background:var(--c)}
.rt-b{border-top:1px solid var(--line);padding:6px 14px 16px}
.rt:not(.open) .rt-b{display:none}
.rt.open .chev{transform:rotate(180deg)}
.ed-h{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px}
.ed-h h3{font-size:15px;font-weight:750;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.ed-h span{font-size:13px;color:var(--muted)}
.erow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.erow:first-of-type{border-top:0}
.erow .f{display:grid;gap:6px;min-width:0}
.erow .f2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.erow input,.erow select{min-height:40px;font-size:15px}
.erow .nm{font-weight:650}
.acts-v{display:flex;flex-direction:column;gap:4px}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.ib .i{width:17px;height:17px}.ib.del{color:var(--red)}.ib:disabled{opacity:.3}
.ibrow{display:flex;gap:4px}
.swatches{display:flex;gap:10px;margin:6px 0 2px}
.sw{width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line-2)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ============ PROGRESO ============ */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.tile{padding:14px}.tile small{display:block;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tile b{display:block;font-size:34px;font-weight:850;line-height:1.1;margin-top:4px}.tile b span{font-size:15px;font-weight:650;color:var(--muted);margin-left:4px}
.tile.hero{grid-column:1/-1;display:flex;align-items:center;gap:16px;border-left:6px solid var(--red)}
.tile.hero b{font-size:44px}
.tile.hero .i{width:44px;height:44px;color:var(--red)}
.tile.hero.off .i{color:var(--faint)}
.cal{padding:12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-size:16px;text-transform:capitalize}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-g small{font-size:11.5px;font-weight:700;color:var(--muted);padding-bottom:2px}
.cd{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:650;color:var(--ink-2);position:relative;background:transparent}
.cd.done{background:var(--c);color:var(--on);font-weight:800}
.cd.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cd.plan::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--faint)}
.cd.blank{visibility:hidden}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding:6px 4px 0}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:11.5px;color:var(--muted);font-weight:650}
.bars i{display:block;width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--good);min-height:3px}
.bars i.low{background:var(--line-2)}
.rec{display:flex;align-items:center;gap:10px;width:100%;padding:12px 4px;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec .it small{font-size:13px}
.rec.sel{background:var(--surface-2);border-radius:10px}
.rec em{font-style:normal;font-weight:800;font-size:15px;white-space:nowrap}
.chart{padding:12px 12px 8px}.chart svg{display:block;width:100%;height:auto}
.hrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .dot{width:12px;height:12px}
.hrow em{font-style:normal;font-size:13px;color:var(--muted);white-space:nowrap;font-weight:650}
.stat-line{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:5px 2px}.stat-line b{color:var(--ink)}

/* ============ hoja inferior ============ */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.veil{position:absolute;inset:0;background:rgba(10,12,14,.55)}
.panel{position:relative;width:100%;max-width:640px;max-height:84vh;display:flex;flex-direction:column;background:var(--surface);
  border-radius:22px 22px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.panel-h h3{font-size:19px}
.sbody{overflow:auto;display:grid;gap:8px;align-content:start}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:700}
.opt small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.opt.cur{border-color:var(--ink)}
.pick{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;padding:12px 6px;border-bottom:1px solid var(--line);font-weight:600}
.pick small{color:var(--muted);font-weight:600;white-space:nowrap}
.pick.new{color:var(--blue);font-weight:750}

/* ============ cronómetro ============ */
.timer{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));z-index:40;padding:0 14px;pointer-events:none}
.timer[hidden]{display:none}
.timer-in{pointer-events:auto;max-width:612px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--ground);
  border-radius:16px;padding:10px 12px 10px 16px;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.timer .cd2{font-size:26px;font-weight:850;font-variant-numeric:tabular-nums;min-width:62px}
.timer .lab{flex:1;min-width:0;font-size:13.5px;line-height:1.25;opacity:.85}
.timer .lab b{display:block;font-size:15px;opacity:1}
.timer .btn{background:transparent;color:var(--ground);border-color:rgba(255,255,255,.35);min-height:38px}
.timer.zero .cd2{color:#7DE0A0}
@media (max-width:380px){.srow{grid-template-columns:44px 1fr 1fr 44px;gap:6px}.srow.m-bw,.srow.m-time{grid-template-columns:44px 1fr 44px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>NICOLEGYM</h1>
    <button type="button" class="pill fire" id="fire" data-act="goprog" aria-label="Racha"></button>
    <button type="button" class="pill" id="themebtn" data-act="theme">Auto</button>
  </header>

  <main>
    <section class="view" id="v-hoy"></section>
    <section class="view" id="v-plan"></section>
    <section class="view" id="v-progreso"></section>
  </main>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="tabs-in" role="tablist">
    <button type="button" class="tab" role="tab" data-act="tab" data-v="hoy"></button>
    <button type="button" class="tab" role="tab" data-act="tab" data-v="plan"></button>
    <button type="button" class="tab" role="tab" data-act="tab" data-v="progreso"></button>
  </div>
</nav>

<div class="timer" id="timer" hidden>
  <div class="timer-in">
    <span class="cd2" id="cd">1:30</span>
    <span class="lab"><b id="tname">Descanso</b><span id="tsub">Siguiente serie al llegar a cero</span></span>
    <button type="button" class="btn" data-act="tstop">Parar</button>
  </div>
</div>

const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

/* ==================================================================
   ESTADO · carga, migración desde la versión anterior y guardado
================================================================== */
const KEY = "nicolegym-v2", OLDKEY = "nicolegym-v1";
let S = defaults();

/* sesiones de la versión anterior → plan de la nueva */
const OLD_DAY = {
  lun:{t:"gym",r:"pecho"}, mar:{t:"pilates"}, mie:{t:"gym",r:"espalda"}, jue:{t:"pilates"}, vie:{t:"gym",r:"pierna"},
  "g-pecho":{t:"gym",r:"pecho"}, "g-espalda":{t:"gym",r:"espalda"}, "g-pierna":{t:"gym",r:"pierna"}, pil:{t:"pilates"}
};
function migrateV1(o){
  const n = defaults();
  const meta = {};
  Object.keys(o.names || {}).forEach(id => { meta[id] = {n:o.names[id], mode:"kg", mg:"Otro"}; });
  ((o.plan && o.plan.days) || []).forEach(d => (d.blocks || []).forEach(b => {
    if (b.type === "lifts") (b.items || []).forEach(it => { meta[it.id] = {n:it.n, mode:it.mode || "kg", mg:it.mg || "Otro"}; });
  }));
  n.meta = meta;
  Object.keys(o.log || {}).forEach(date => {
    const s = clone(o.log[date]); if (!s) return;
    const chk = {};
    if (s.cardio) chk.cardio = 1;
    if (s.pil && s.pil.length) { chk.class = 1; s.pm = s.pil.slice(); }
    if (s.blk && Object.keys(s.blk).length) chk.legacy = 1;
    (s.extra || []).forEach(it => { meta[it.id] = {n:it.n, mode:it.mode || "kg", mg:it.mg || "Otro"}; });
    if (s.day && OLD_DAY[s.day]) n.over[date] = clone(OLD_DAY[s.day]);
    n.log[date] = {ex:s.ex || {}, chk, pm:s.pm};
    if (!n.log[date].pm) delete n.log[date].pm;
  });
  return n;
}
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  if (raw) {
    try { const o = JSON.parse(raw); if (o && o.v === 2 && o.routines) { S = Object.assign(defaults(), o); return; } } catch(e){}
  }
  try {
    const old = localStorage.getItem(OLDKEY);
    if (old) { S = migrateV1(JSON.parse(old)); return; }
  } catch(e){}
  S = defaults();
}
load();

function rebuildMeta(){
  S.routines.forEach(r => r.ex.forEach(x => { S.meta[x.id] = {n:x.n, mode:x.mode, mg:x.mg}; }));
  S.core.ex.forEach(x => { S.meta[x.id] = {n:x.n, mode:x.mode, mg:x.mg}; });
}
function prune(){
  Object.keys(S.log).forEach(d => {
    const s = S.log[d]; s.ex = s.ex || {}; s.chk = s.chk || {};
    Object.keys(s.ex).forEach(id => {
      if (!s.ex[id].some(x => x.d || x.kg != null || x.r != null || x.s != null)) delete s.ex[id];
    });
    if (!Object.keys(s.ex).length && !Object.keys(s.chk).length && !s.cm && !s.pm) delete S.log[d];
  });
}
let saveT = null;
function persist(){ prune(); rebuildMeta(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function save(){ clearTimeout(saveT); saveT = setTimeout(persist, 250); }
function saveNow(){ clearTimeout(saveT); persist(); }
rebuildMeta();

const rt = id => S.routines.find(r => r.id === id) || null;
const gyms = () => S.routines.filter(r => r.kind === "gym");
function listOf(rid, key){
  if (rid === "core") return key === "ex" ? S.core.ex : null;
  const r = rt(rid); return r ? r[key] : null;
}
function EXI(id){
  for (const r of S.routines) { const x = r.ex.find(e => e.id === id); if (x) return x; }
  const c = S.core.ex.find(e => e.id === id); if (c) return c;
  const m = S.meta[id] || {};
  return {id, n:m.n || id, mode:m.mode || "kg", mg:m.mg || "Otro", reps:"", rest:60, cue:""};
}
function uniqueId(base){
  let s = norm(base || "ej").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 22) || "ej";
  let id = s, i = 2;
  while (S.meta[id] || S.routines.some(r => r.id === id) || id === "core") id = s + "-" + (i++);
  return id;
}
function planOf(date){
  if (S.over[date]) return S.over[date];
  return S.week[parseISO(date).getDay()] || {t:"rest"};
}
function routineOf(p){
  if (p.t === "gym") return rt(p.r);
  if (p.t === "pilates") return rt("pilates");
  return null;
}
const kindOf = date => routineOf(planOf(date)) ? planOf(date).t : "rest";
function nameOf(date){ const r = routineOf(planOf(date)); return r ? r.name : "Descanso"; }
function colorOf(date){ const r = routineOf(planOf(date)); return r ? colVar(r.color) : "var(--muted)"; }

================================================================== */
const blankSet = p => ({kg:null, r:null, s:null, d:0, w:0, p: p ? 1 : 0});
const blankSets = () => Array.from({length: WORK_SETS}, () => blankSet(0)).concat([blankSet(1)]);
const withPR = a => { if (!a.some(x => x.p)) a.push(blankSet(1)); return a; };
const isWork = x => !x.p && !x.w;
function ensureLog(d){
  if (!S.log[d]) S.log[d] = {ex:{}, chk:{}};
  const s = S.log[d]; s.ex = s.ex || {}; s.chk = s.chk || {};
  return s;
}
function setsFor(date, ex){
  const s = ensureLog(date);
  if (!s.ex[ex.id]) s.ex[ex.id] = blankSets();
  return withPR(s.ex[ex.id]);
}
const rawSets = (date, id) => (S.log[date] && S.log[date].ex && S.log[date].ex[id]) || null;
function exDone(date, id){
  const a = rawSets(date, id); if (!a) return false;
  const w = a.filter(isWork);
  return w.length > 0 && w.every(x => x.d);
}
const chkOn = (date, key) => !!(S.log[date] && S.log[date].chk && S.log[date].chk[key]);
function done(date){
  const s = S.log[date]; if (!s) return false;
  if (s.chk && Object.keys(s.chk).length) return true;
  return Object.keys(s.ex || {}).some(id => s.ex[id].some(x => x.d));
}
const loggedDates = () => Object.keys(S.log).filter(done).sort();

/* mejor serie = más peso y, a igualdad, más repeticiones */
function valid(c, mode){ return mode === "time" ? c.s > 0 : mode === "bw" ? c.r > 0 : c.kg > 0; }
function cmp(a, b, mode){
  if (mode === "time") return (a.s || 0) - (b.s || 0);
  if (mode === "bw") return (a.r || 0) - (b.r || 0);
  return ((a.kg || 0) - (b.kg || 0)) || ((a.r || 0) - (b.r || 0));
}
function bestOf(sets, mode){
  let b = null;
  (sets || []).forEach(x => {
    if (!x.d || x.w) return;
    const c = mode === "time" ? {s:+x.s || 0} : mode === "bw" ? {r:+x.r || 0} : {kg:+x.kg || 0, r:+x.r || 0};
    if (!valid(c, mode)) return;
    if (!b || cmp(c, b, mode) > 0) b = c;
  });
  return b;
}
function fmtBest(b, mode){
  if (!b) return "—";
  if (mode === "time") return nf(b.s) + " s";
  if (mode === "bw") return b.r + " reps";
  return nf(b.kg) + " kg × " + (b.r || "?");
}
const valOf = (b, mode) => mode === "time" ? b.s : mode === "bw" ? b.r : b.kg;
function exHist(id){
  const mode = EXI(id).mode || "kg";
  const out = [];
  Object.keys(S.log).sort().forEach(date => {
    const a = rawSets(date, id); if (!a) return;
    const best = bestOf(a, mode); if (!best) return;
    const vol = a.reduce((t, x) => t + (x.d && isWork(x) && x.kg > 0 && x.r > 0 ? x.kg * x.r : 0), 0);
    out.push({date, best, vol});
  });
  return out;
}
function recordOf(hist, mode){
  let rec = null;
  hist.forEach(h => { if (!rec || cmp(h.best, rec.best, mode) > 0) rec = h; });
  return rec;
}
function sessionVol(date){
  const s = S.log[date]; if (!s) return 0;
  return Object.keys(s.ex || {}).reduce((t, id) => t + s.ex[id].reduce((u, x) =>
    u + (x.d && isWork(x) && x.kg > 0 && x.r > 0 ? x.kg * x.r : 0), 0), 0);
}
function sessionPRs(date){
  const s = S.log[date]; if (!s) return 0;
  let n = 0;
  Object.keys(s.ex || {}).forEach(id => {
    const mode = EXI(id).mode || "kg";
    const today = bestOf(s.ex[id], mode); if (!today) return;
    const prev = recordOf(exHist(id).filter(h => h.date < date), mode);
    if (prev && cmp(today, prev.best, mode) > 0) n++;
  });
  return n;
}

/* ==================================================================
   RACHA · días de descanso planificados no la rompen
================================================================== */
function streak(){
  const dates = loggedDates(); if (!dates.length) return 0;
  const first = dates[0];
  let d = parseISO(TODAY), n = 0;
  for (let i = 0; i < 3700; i++) {
    const k = iso(d);
    if (k < first) break;
    if (done(k)) n++;
    else if (k === TODAY || kindOf(k) === "rest") { /* hoy aún puede hacerse; el descanso planificado no rompe */ }
    else break;
    d = addDays(d, -1);
  }
  return n;
}
function bestStreak(){
  const dates = loggedDates(); if (!dates.length) return 0;
  let d = parseISO(dates[0]), best = 0, run = 0;
  const end = parseISO(TODAY);
  while (d <= end) {
    const k = iso(d);
    if (done(k)) { run++; best = Math.max(best, run); }
    else if (k === TODAY || kindOf(k) === "rest") { /* no rompe */ }
    else run = 0;
    d = addDays(d, 1);
  }
  return best;
}
function weekStats(start){
  let n = 0, target = 0;
  for (let i = 0; i < 7; i++) {
    const k = iso(addDays(start, i));
    const d = done(k), planned = kindOf(k) !== "rest";
    if (d) n++;
    if (planned || d) target++;
  }
  return {n, target};
}

function units(date, r){
  const p = planOf(date);
  let tt = 0, dn = 0;
  r.warm.forEach(it => { tt++; if (chkOn(date, "w:" + it.id)) dn++; });
  if (r.kind === "pilates") { tt++; if (chkOn(date, "class")) dn++; }
  else r.ex.forEach(ex => { tt++; if (exDone(date, ex.id)) dn++; });
  S.core.ex.forEach(ex => { tt++; if (exDone(date, ex.id)) dn++; });
  tt++; if (chkOn(date, "cardio")) dn++;
  r.stretch.forEach(it => { tt++; if (chkOn(date, "s:" + it.id)) dn++; });
  return {dn, tt, p};
}

function exHTML(date, ex, col){
  const raw = rawSets(date, ex.id);
  const sets = raw ? withPR(raw) : blankSets();
  const mode = ex.mode || "kg";
  const hist = exHist(ex.id).filter(h => h.date < date);
  const last = hist.length ? hist[hist.length - 1] : null;
  const rec = recordOf(hist, mode);
  const today = bestOf(sets, mode);
  const isPR = !!(today && rec && cmp(today, rec.best, mode) > 0);
  const dn = exDone(date, ex.id);
  const key = date + "|" + ex.id, open = openEx.has(key);
  let h = '<div class="ex"><button type="button" class="ex-h" data-act="exo" data-key="' + key + '">' +
    '<span class="tick' + (dn ? " on" : "") + '">' + I("chk") + '</span>' +
    '<span class="it"><b>' + esc(ex.n) + '</b><small>' + WORK_SETS + ' series + PR' + (ex.reps ? ' · <b>' + esc(ex.reps) + '</b>' : '') + '</small></span>' +
    (isPR ? '<span class="badge" style="--c:' + col + '">¡PR!</span>' : '') +
    '<span class="chev">' + I("chev") + '</span></button>';
  if (open) {
    h += '<div class="ex-b">';
    if (ex.cue) h += '<p class="cue">' + esc(ex.cue) + '</p>';
    h += '<div class="ref"><span>Última vez: <b>' + (last ? fechaCorta(last.date) + " · " + fmtBest(last.best, mode) : "—") + '</b></span>' +
      '<span>Tu PR: <b>' + (rec ? fmtBest(rec.best, mode) : "—") + '</b></span></div>';
    const cols = mode === "kg" ? "" : " m-" + mode;
    h += '<div class="srow head' + cols + '"><span>Serie</span>' + (mode === "kg" ? '<span>kg</span><span>reps</span>' :
      mode === "bw" ? '<span>reps</span>' : '<span>segundos</span>') + '<span></span></div>';
    let n = 0;
    sets.forEach((x, i) => {
      if (x.w) return;
      const lab = x.p ? "PR" : String(++n);
      const ph = x.p ? (rec ? rec.best : null) : (last ? last.best : null);
      const f = (k, hold) => '<input type="text" inputmode="decimal" data-f="' + k + '" data-ex="' + ex.id + '" data-i="' + i + '" value="' +
        (x[k] == null ? "" : esc(x[k])) + '" placeholder="' + (ph && ph[hold] != null ? esc(ph[hold]) : "·") + '" aria-label="' + k + '">';
      h += '<div class="srow' + cols + (x.p ? " pr" : "") + (x.d ? " done" : "") + '" style="--c:' + col + '"><span class="slab">' + lab + '</span>' +
        (mode === "kg" ? f("kg", "kg") + f("r", "r") : mode === "bw" ? f("r", "r") : f("s", "s")) +
        '<button type="button" class="tick' + (x.d ? " on" : "") + '" data-act="set" data-ex="' + ex.id + '" data-i="' + i + '" aria-label="Serie hecha">' + I("chk") + '</button></div>';
    });
    const prRow = sets.find(x => x.p);
    if (prRow && !prRow.d && sets.some(x => isWork(x) && x.d) && bestOf(sets.filter(isWork), mode))
      h += '<button type="button" class="link" data-act="usebest" data-ex="' + ex.id + '">Usar mi mejor serie de hoy como PR</button>';
    h += '</div>';
  }
  return h + '</div>';
}

function chartLine(pts, unit){
  if (pts.length < 2) return '<div class="empty">Registra este ejercicio en al menos 2 sesiones para ver la evolución.</div>';
  const w = 320, h = 160, pl = 38, pr = 12, pt = 16, pb = 26;
  const vs = pts.map(p => p.v); let min = Math.min.apply(null, vs), max = Math.max.apply(null, vs);
  if (min === max) { min -= 1; max += 1; }
  const x = i => pl + (w - pl - pr) * i / (pts.length - 1), y = v => pt + (h - pt - pb) * (1 - (v - min) / (max - min));
  const path = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" ");
  const L = pts.length - 1;
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Evolución">' +
    '<line x1="' + pl + '" x2="' + (w - pr) + '" y1="' + y(max) + '" y2="' + y(max) + '" style="stroke:var(--line)"/>' +
    '<line x1="' + pl + '" x2="' + (w - pr) + '" y1="' + y(min) + '" y2="' + y(min) + '" style="stroke:var(--line)"/>' +
    '<text x="' + (pl - 6) + '" y="' + (y(max) + 4) + '" text-anchor="end" font-size="11" style="fill:var(--muted)">' + nf(max) + '</text>' +
    '<text x="' + (pl - 6) + '" y="' + (y(min) + 4) + '" text-anchor="end" font-size="11" style="fill:var(--muted)">' + nf(min) + '</text>' +
    '<path d="' + path + '" fill="none" stroke-width="2.6" stroke-linejoin="round" style="stroke:var(--blue)"/>' +
    pts.map((p, i) => '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="' + (i === L ? 5 : 3.2) + '" style="fill:' + (i === L ? "var(--red)" : "var(--blue)") + '"/>').join("") +
    '<text x="' + pl + '" y="' + (h - 6) + '" font-size="11" style="fill:var(--muted)">' + fechaCorta(pts[0].date) + '</text>' +
    '<text x="' + (w - pr) + '" y="' + (h - 6) + '" text-anchor="end" font-size="11" style="fill:var(--muted)">' + fechaCorta(pts[L].date) + '</text></svg>' +
    '<div class="stat-line"><span>Unidad</span><b>' + unit + '</b></div>';
}

function renderProgreso(){
  const dates = loggedDates(), st = streak(), best = bestStreak();
  const wk = weekStats(mondayOf(new Date()));
  const monthKey = new Date().getFullYear() + "-" + pad(new Date().getMonth() + 1);
  let h = '<div class="tiles"><div class="card tile hero' + (st ? "" : " off") + '">' + I("flame") + '<div><small>Racha de actividad</small><b>' + st +
    '<span>' + (st === 1 ? "día" : "días") + '</span></b></div></div>' +
    '<div class="card tile"><small>Mejor racha</small><b>' + best + '<span>' + (best === 1 ? 'día' : 'días') + '</span></b></div>' +
    '<div class="card tile"><small>Esta semana</small><b>' + wk.n + '<span>de ' + wk.target + '</span></b></div>' +
    '<div class="card tile"><small>Este mes</small><b>' + dates.filter(d => d.startsWith(monthKey)).length + '<span>sesiones</span></b></div>' +
    '<div class="card tile"><small>Sesiones totales</small><b>' + dates.length + '</b></div></div>';

  /* semanas */
  const ws = mondayOf(new Date()), bars = [];
  for (let i = 7; i >= 0; i--) { const s = addDays(ws, -7 * i), t = weekStats(s); bars.push({lab: s.getDate() + "/" + (s.getMonth() + 1), n: t.n, t: t.target}); }
  const mx = Math.max.apply(null, bars.map(b => Math.max(b.n, b.t, 1)));
  h += '<section class="sec"><h2>Últimas 8 semanas</h2><p class="hint">Sesiones hechas por semana (verde = objetivo cumplido).</p><div class="card pad"><div class="bars">' +
    bars.map(b => '<div><span>' + b.n + '</span><i class="' + (b.n >= b.t && b.n > 0 ? "" : "low") + '" style="height:' + Math.round(b.n / mx * 90) + 'px"></i><span>' + b.lab + '</span></div>').join("") + '</div></div></section>';

  /* calendario */
  const first = new Date(calY, calM, 1), nd = new Date(calY, calM + 1, 0).getDate(), off = (first.getDay() + 6) % 7;
  let cal = '<div class="card cal"><div class="cal-h"><button type="button" class="ib" data-act="calm" data-n="-1" aria-label="Mes anterior">' + I("left") + '</button><b>' + MESES[calM] + ' ' + calY +
    '</b><button type="button" class="ib" data-act="calm" data-n="1" aria-label="Mes siguiente">' + I("right") + '</button></div><div class="cal-g">' +
    ["L","M","X","J","V","S","D"].map(d => '<small>' + d + '</small>').join("");
  for (let i = 0; i < off; i++) cal += '<span class="cd blank"></span>';
  for (let d = 1; d <= nd; d++) {
    const k = calY + "-" + pad(calM + 1) + "-" + pad(d), dn = done(k);
    cal += '<button type="button" class="cd' + (dn ? " done" : "") + (k === TODAY ? " today" : "") + (!dn && kindOf(k) !== "rest" ? " plan" : "") + '" data-act="goto" data-date="' + k +
      '" style="--c:' + colorOf(k) + '">' + d + '</button>';
  }
  h += '<section class="sec"><h2>Calendario</h2><p class="hint">Los días en color son sesiones hechas. Toca un día para abrirlo.</p>' + cal + '</div></div></section>';

  /* récords */
  const ids = {};
  dates.forEach(d => Object.keys(S.log[d].ex || {}).forEach(id => { ids[id] = 1; }));
  const recs = Object.keys(ids).map(id => {
    const ex = EXI(id), hs = exHist(id), mode = ex.mode || "kg", rec = recordOf(hs, mode);
    return rec ? {id, ex, hs, mode, rec} : null;
  }).filter(Boolean).sort((a, b) => b.rec.date.localeCompare(a.rec.date));
  if (!progEx || !recs.some(r => r.id === progEx)) progEx = recs.length ? recs[0].id : null;
  h += '<section class="sec"><h2>Récords y evolución</h2><p class="hint">Tu mejor serie de cada ejercicio. Toca uno para ver su gráfica.</p>';
  if (!recs.length) h += '<div class="card empty">Aún no hay series registradas. Marca series en Hoy y aparecerán aquí.</div>';
  else {
    const sel = recs.find(r => r.id === progEx);
    h += '<div class="card chart"><b style="font-size:16px">' + esc(sel.ex.n) + '</b>' +
      chartLine(sel.hs.map(x => ({date:x.date, v:valOf(x.best, sel.mode)})), sel.mode === "time" ? "segundos" : sel.mode === "bw" ? "repeticiones" : "kg (mejor serie)") + '</div>' +
      '<div class="card pad" style="margin-top:10px;padding-top:4px;padding-bottom:4px">' + recs.map(r => '<button type="button" class="rec' + (r.id === progEx ? " sel" : "") + '" data-act="recsel" data-id="' + r.id + '">' +
        '<span class="it"><b>' + esc(r.ex.n) + '</b><small>' + r.hs.length + ' sesiones · ' + fechaCorta(r.rec.date) + '</small></span><em>' + fmtBest(r.rec.best, r.mode) + '</em></button>').join("") + '</div>';
  }
  h += '</section>';

  /* últimas sesiones */
  const last = dates.slice().reverse().slice(0, 12);
  h += '<section class="sec"><h2>Últimas sesiones</h2>';
  if (!last.length) h += '<div class="card empty">Todavía no hay sesiones.</div>';
  else h += '<div class="card pad" style="padding-top:4px;padding-bottom:4px">' + last.map(d => {
    const s = S.log[d], nEx = Object.keys(s.ex || {}).filter(id => s.ex[id].some(x => x.d)).length, vol = sessionVol(d), prs = sessionPRs(d);
    return '<button type="button" class="hrow" data-act="goto" data-date="' + d + '"><span class="dot" style="--c:' + colorOf(d) + '"></span><span class="it"><b>' + esc(nameOf(d)) + '</b><small>' +
      nEx + (nEx === 1 ? ' ejercicio' : ' ejercicios') + (vol ? ' · ' + nf(vol) + ' kg de volumen' : '') + (prs ? ' · ' + prs + ' PR' : '') + '</small></span><em>' + relLabel(d) + ' ' + parseISO(d).getDate() + '</em></button>';
  }).join("") + '</div>';
  h += '</section>';
  $("#v-progreso").innerHTML = h;
}

function openCatalog(rid){

  drawCatalog();
}
function drawCatalog(){
  const q = norm($("#sheet-q").value.trim());
  const list = CATALOG.map((c, i) => ({c, i})).filter(x => !q || norm(x.c[0]).includes(q) || norm(x.c[1]).includes(q)).slice(0, 60);

function addExercise(name, mg, mode, rest){
  const rid = sheetCtx && sheetCtx.rid; const list = listOf(rid, "ex"); if (!list) return;
  list.push({id: uniqueId(name), n: name, reps: mode === "time" ? "45 s" : "10–12", mg: rid === "core" && mg === "Otro" ? "Core" : mg, mode, rest: rest || 60, cue: ""});
  closeSheet(); saveNow();
  if (view === "plan") { openR = rid; }
  renderAll();
}

/* ==================================================================
   CRONÓMETRO DE DESCANSO
================================================================== */
let tick = null, tEnd = 0;
function startTimer(secs, name){
  if (!secs) return;
  clearInterval(tick); tEnd = Date.now() + secs * 1000;
  $("#tname").textContent = name || "Descanso"; $("#tsub").textContent = "Siguiente serie al llegar a cero";
  $("#timer").hidden = false; $("#timer").classList.remove("zero");
  updTimer(); tick = setInterval(updTimer, 250);
}
function updTimer(){
  const left = Math.max(0, Math.ceil((tEnd - Date.now()) / 1000));
  $("#cd").textContent = Math.floor(left / 60) + ":" + pad(left % 60);
  if (left === 0) {
    clearInterval(tick); $("#timer").classList.add("zero"); $("#tsub").textContent = "¡A por la siguiente serie!";
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch(e){}
    setTimeout(stopTimer, 6000);
  }
}
function stopTimer(){ clearInterval(tick); $("#timer").hidden = true; }

   EVENTOS
================================================================== */
function swap(a, i, j){ const t = a[i]; a[i] = a[j]; a[j] = t; }
function download(name, text){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:"application/json"})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

document.addEventListener("click", e => {
  if (e.target.id === "dp" && e.target.showPicker) { try { e.target.showPicker(); } catch(x){} return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const d = el.dataset, act = d.act;
  switch (act) {
    case "tab": go(d.v); return;
    case "goprog": go("progreso"); return;
    case "theme": theme = theme === "auto" ? "dark" : theme === "dark" ? "light" : "auto"; try { localStorage.setItem(TKEY, theme); } catch(x){} applyTheme(); return;
    case "closesheet": closeSheet(); return;
    case "tstop": stopTimer(); return;

    /* HOY */
    case "goto": cur = d.date; if (view !== "hoy") { view = "hoy"; } renderAll(); window.scrollTo(0, 0); return;
    case "day": cur = iso(addDays(parseISO(cur), +d.n)); renderAll(); return;
    case "blk": shut.has(d.key) ? shut.delete(d.key) : shut.add(d.key); renderAll(); return;
    case "exo": openEx.has(d.key) ? openEx.delete(d.key) : openEx.add(d.key); renderAll(); return;
    case "chk": { const s = ensureLog(cur); if (s.chk[d.key]) delete s.chk[d.key]; else s.chk[d.key] = 1; saveNow(); renderAll(); return; }
    case "pm": {
      const s = ensureLog(cur), p = planOf(cur);
      const mods = (s.pm || (p.m ? [p.m] : [])).slice(), i = mods.indexOf(d.m);
      if (i >= 0) mods.splice(i, 1); else mods.push(d.m);
      s.pm = mods; saveNow(); renderAll(); return;
    }
    case "cm": { ensureLog(cur).cm = d.o; saveNow(); renderAll(); return; }
    case "set": {
      const ex = EXI(d.ex), sets = setsFor(cur, ex), x = sets[+d.i], mode = ex.mode || "kg";
      if (!x.d) {
        const hist = exHist(ex.id).filter(h => h.date < cur), last = hist.length ? hist[hist.length - 1].best : null;
        if (last) {
          if (mode === "kg" && x.kg == null) x.kg = last.kg;
          if (mode !== "time" && x.r == null && last.r) x.r = last.r;
          if (mode === "time" && x.s == null) x.s = last.s;
        }
        x.d = 1; if (!x.p) startTimer(ex.rest, ex.n);
      } else x.d = 0;
      saveNow(); renderAll(); return;
    }
    case "usebest": {
      const ex = EXI(d.ex), sets = setsFor(cur, ex), b = bestOf(sets.filter(isWork), ex.mode || "kg"), pr = sets.find(x => x.p);
      if (b && pr) { pr.kg = b.kg != null ? b.kg : null; pr.r = b.r != null ? b.r : null; pr.s = b.s != null ? b.s : null; pr.d = 1; }
      saveNow(); renderAll(); return;
    }
    case "change": openChange(); return;
    case "setday": {
      if (d.t === "plan") delete S.over[cur];
      else if (d.t === "gym") S.over[cur] = {t:"gym", r:d.r};
      else if (d.t === "pilates") S.over[cur] = {t:"pilates"};
      else S.over[cur] = {t:"rest"};
      closeSheet(); saveNow(); renderAll(); return;
    }
    case "editr": openR = d.rid; go("plan"); return;
    case "clearday":
      if (confirm("¿Borrar todo el registro de este día? No se puede deshacer.")) { delete S.log[cur]; saveNow(); renderAll(); }
      return;

    /* EJERCICIOS (añadir desde Hoy o Plan) */
    case "addex": openCatalog(d.rid); return;
    case "pickcat": { const c = CATALOG[+d.i]; addExercise(c[0], c[1], c[2], c[3]); return; }
    case "picknew": { const n = $("#sheet-q").value.trim(); if (n) addExercise(n, "Otro", "kg", 75); return; }

    /* PLAN */
    case "wk": {
      const wd = +d.wd, old = S.week[wd] || {};
      if (d.t === "gym") S.week[wd] = {t:"gym", r: (old.r && rt(old.r)) ? old.r : gyms()[0].id};
      else if (d.t === "pilates") S.week[wd] = {t:"pilates", m: old.m || "suelo"};
      else S.week[wd] = {t:"rest"};
      saveNow(); renderAll(); return;
    }
    case "wkr": S.week[+d.wd] = {t:"gym", r:d.r}; saveNow(); renderAll(); return;
    case "wkm": S.week[+d.wd] = {t:"pilates", m:d.m}; saveNow(); renderAll(); return;
    case "rtoggle": openR = openR === d.rid ? null : d.rid; renderAll(); return;
    case "color": { const r = rt(d.rid); if (r) { r.color = d.c; saveNow(); renderAll(); } return; }
    case "add": {
      const l = listOf(d.rid, d.key); if (!l) return;
      l.push({id: uid(), t: "", s: "", v: ""}); saveNow(); renderAll();
      const inp = document.querySelector('[data-af="' + d.key + (l.length - 1) + '"]'); if (inp) inp.focus();
      return;
    }
    case "up": case "down": {
      const l = listOf(d.rid, d.key), i = +d.i, j = act === "up" ? i - 1 : i + 1;
      if (l && j >= 0 && j < l.length) { swap(l, i, j); saveNow(); renderAll(); }
      return;
    }
    case "del": {
      const l = listOf(d.rid, d.key), i = +d.i; if (!l || !l[i]) return;
      const nm = l[i].n || l[i].t || "este elemento";
      if (confirm("¿Quitar «" + nm + "» de la rutina? Tu historial se conserva.")) { l.splice(i, 1); saveNow(); renderAll(); }
      return;
    }
    case "rtnew": {
      const id = uniqueId("rutina");
      S.routines.splice(S.routines.findIndex(r => r.kind === "pilates"), 0, {id, kind:"gym", name:"Nueva rutina", color:"red",
        warm:[W("Bici o cinta suave", "Sube pulsaciones sin fatigar", "5 min"), W("Movilidad general", "", "3 min")], ex:[],
        stretch:[W("Estiramiento general", "", "5 min")]});
      openR = id; saveNow(); renderAll(); return;
    }
    case "rtdel": {
      const r = rt(d.rid); if (!r) return;
      if (!confirm("¿Eliminar la rutina «" + r.name + "»? Tu historial se conserva.")) return;
      S.routines = S.routines.filter(x => x.id !== r.id);
      const rep = gyms()[0].id;
      Object.keys(S.week).forEach(k => { if (S.week[k].t === "gym" && S.week[k].r === r.id) S.week[k] = {t:"gym", r:rep}; });
      Object.keys(S.over).forEach(k => { if (S.over[k].t === "gym" && S.over[k].r === r.id) delete S.over[k]; });
      openR = null; saveNow(); renderAll(); return;
    }
    case "export": download("nicolegym-" + TODAY + ".json", JSON.stringify(S)); return;
    case "resetplan":
      if (confirm("¿Restaurar las rutinas, la semana y los ajustes originales? Tus registros y récords se conservan.")) {
        const n = defaults(); S.routines = n.routines; S.core = n.core; S.cardio = n.cardio; S.pilates = n.pilates; S.week = n.week; openR = null; saveNow(); renderAll();
      }
      return;

    /* PROGRESO */
    case "calm": { calM += +d.n; if (calM < 0) { calM = 11; calY--; } if (calM > 11) { calM = 0; calY++; } renderAll(); return; }
    case "recsel": progEx = d.id; renderAll(); return;
  }
});

document.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (t.id === "sheet-q") { drawCatalog(); return; }
  if (d.ed !== undefined) {
    const l = listOf(d.rid, d.key), it = l && l[+d.i];
    if (it) { it[d.p] = t.value; save(); }
  } else if (d.rn) {
    const r = rt(d.rn); if (r) { r.name = t.value; save(); }
  } else if (d.f) {
    const ex = EXI(d.ex), sets = setsFor(cur, ex), x = sets[+d.i];
    x[d.f] = num(t.value); save();
  } else if (d.cfg) {
    if (d.cfg === "cardio.opts") { const o = t.value.split(",").map(s => s.trim()).filter(Boolean); if (o.length) S.cardio.opts = o; }
    else { const n = num(t.value); if (n > 0) { if (d.cfg === "cardio.min") S.cardio.min = n; else S.pilates.min = n; } }
    save();
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "dp" && t.value) { cur = t.value; renderAll(); return; }
  if (t.id === "imp" && t.files && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const o = JSON.parse(fr.result);
        let n = null;
        if (o && o.v === 2 && o.routines) n = Object.assign(defaults(), o);
        else if (o && o.plan && o.log) n = migrateV1(o);
        if (!n) throw new Error("formato");
        if (confirm("Esto reemplaza los datos actuales de la app por los de la copia. ¿Continuar?")) { S = n; saveNow(); renderAll(); }
      } catch(x) { alert("No se pudo leer el archivo."); }
    };
    fr.readAsText(t.files[0]); t.value = "";
  }
});
window.addEventListener("pagehide", saveNow);
document.addEventListener("visibilitychange", () => { if (document.hidden) saveNow(); });

applyTheme();
renderAll();
</script>
<script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }</script>
